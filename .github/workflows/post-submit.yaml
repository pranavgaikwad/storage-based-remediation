name: Publish Container Images
on:
  push:
    branches:
      - main
      - 'release-*'
      - 'medik8s-*'
    tags:
      - '**'

permissions:
  contents: read

jobs:
  push_to_registry:
    uses: pranavgaikwad/medik8s-meta-github/.github/workflows/post_submit.yaml@release-workflow-shared
    with:
      make_targets: container-build-and-push
      make_vars: CONTAINER_TOOL=docker
      image_registry: ${{ vars.IMAGE_REGISTRY || 'quay.io/medik8s' }}
    secrets:
      QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
      QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
